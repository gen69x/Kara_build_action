name: Build Project-KARA Kernel + KernelSU

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - LICENSE

# Mencegah beberapa build kernel berjalan bersamaan.
concurrency:
  group: project-kara-kernel-build
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-kernel:
    name: Build Kernel (Onclite + KernelSU + Proton Clang)
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Maximize build space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 4096
          swap-size-mb: 8192
          remove-dotnet: true
          remove-android: true
          remove-haskell: true
          remove-codeql: true
          remove-docker-images: true

      - name: Check available disk space
        run: df -h

      - name: Build Kernel
        uses: dabao1955/kernel_build_action@main
        with:
          # Kernel source
          kernel-url: https://github.com/gen69x/Project-KARA
          kernel-branch: Kara-KSU
          config: onclite-perf_defconfig
          arch: arm64
          depth: 1

          # Mengizinkan warning compiler tanpa menggagalkan build.
          # extra-make-args: '["KCFLAGS=-Wno-error", "KCPPFLAGS=-Wno-error"]'

          # Toolchain
          aosp-gcc: true
          aosp-clang: false
          other-clang-url: https://github.com/kdrag0n/proton-clang
          other-clang-branch: master

          # KernelSU
          ksu: true

          # AnyKernel3 packaging
          anykernel3: true
          anykernel3-url: https://github.com/gen69x/AnyKernel3

          # GitHub Release
          release: true
          access-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Notify Telegram (Success)
        if: success()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RELEASE_URL: ${{ github.server_url }}/${{ github.repository }}/releases/latest
          RUN_NUMBER: ${{ github.run_number }}
          BRANCH_NAME: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${TELEGRAM_BOT_TOKEN}" || -z "${TELEGRAM_CHAT_ID}" ]]; then
            echo "Telegram secrets belum dikonfigurasi; notifikasi dilewati."
            exit 0
          fi

          message=$(cat <<EOF
✅ *Project-KARA Build Selesai*

📱 Device: Onclite (Redmi 7)
🔢 Run: #${RUN_NUMBER}
🌿 Branch: ${BRANCH_NAME}

📦 [Download Release](${RELEASE_URL})
🔗 [Log Build](${RUN_URL})
EOF
          )

          curl \
            --fail \
            --silent \
            --show-error \
            --retry 3 \
            --retry-delay 5 \
            --request POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "parse_mode=Markdown" \
            --data-urlencode "text=${message}" \
            --data-urlencode "disable_web_page_preview=false" || \
            echo "Gagal mengirim notifikasi Telegram."

      - name: Notify Telegram (Failure)
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_NUMBER: ${{ github.run_number }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${TELEGRAM_BOT_TOKEN}" || -z "${TELEGRAM_CHAT_ID}" ]]; then
            echo "Telegram secrets belum dikonfigurasi; notifikasi dilewati."
            exit 0
          fi

          message=$(cat <<EOF
❌ *Project-KARA Build Gagal*

🔢 Run: #${RUN_NUMBER}
🔗 [Lihat Log](${RUN_URL})

Cek log GitHub Actions untuk detail error.
EOF
          )

          curl \
            --fail \
            --silent \
            --show-error \
            --retry 3 \
            --retry-delay 5 \
            --request POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "parse_mode=Markdown" \
            --data-urlencode "text=${message}" || \
            echo "Gagal mengirim notifikasi Telegram."
